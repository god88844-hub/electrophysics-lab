<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Invention Lab WebGL browser smoke</title>
<link rel="stylesheet" href="../css/style.css"></head>
<body>
<div id="app"></div>
<pre id="smoke-result" data-smoke-result="pending">PENDING</pre>
<script type="module">
import '../js/main.js';
import { sceneFromDiagram, portPoint3D } from '../js/scene/layout.js';
const output=document.querySelector('#smoke-result');
const assert=(condition,message)=>{if(!condition)throw Error(message);};
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
try{
  await pause(180);
  const app=window.inventionLab?.app;
  assert(app,'application failed to boot');
  app.switchLab('logic');
  const d=app.diagrams.logic;
  const before=d.blocks.length;
  const a=app.editor.addBlock('logic.IN',0,0);
  const b=app.editor.addBlock('logic.NOT',240,0);
  assert(d.blocks.length===before+2,'adding canonical logic blocks failed');
  assert(app.set3D(true)===true,'WebGL view failed to activate');
  await pause(150);
  assert(app.scene3d.available,'WebGL unavailable');
  const gl=app.scene3d.gl;
  app.scene3d.render();
  assert(gl.getError()===gl.NO_ERROR,'WebGL draw produced a GL error');
  const scene=sceneFromDiagram(d);
  const out=portPoint3D(scene.blocks.find(x=>x.id===a.id),'out','out');
  const input=portPoint3D(scene.blocks.find(x=>x.id===b.id),'a','in');
  assert(out && input,'3D ports missing');
  const viewer=app.scene3d;
  assert(viewer.experimentPanel?.querySelector('input[type="range"]'),
    '3D simulator-linked experiment panel missing');
  assert(viewer.experimentExport?.disabled,
    'Cannot save experiment data before running the solver');
  viewer.setExperiment(d,{ok:false,problems:['No simulated evidence']});
  assert(viewer.experimentStatus.textContent.includes('No simulated evidence'),
    'Unsuccessful solver trace must be labeled unavailable');
  assert(viewer.experimentExport.disabled,
    'Rejected simulation must not become downloadable evidence');
  const clickPort=point=>{
    const pos=viewer.project(point);
    assert(pos,'port projected behind camera');
    const rect=viewer.canvas.getBoundingClientRect();
    const event=new PointerEvent('pointerdown',{bubbles:true,cancelable:true,
      pointerId:1,clientX:rect.left+pos.x,clientY:rect.top+pos.y});
    viewer.canvas.dispatchEvent(event);
  };
  const count=d.wires.length;
  clickPort(out);
  assert(viewer.wireSource?.blockId===a.id,'3D output socket was not selected');
  clickPort(input);
  assert(d.wires.length===count+1,'3D click-to-wire did not update real Diagram');
  assert(d.wires.at(-1).from.block===a.id && d.wires.at(-1).to.block===b.id,
    '3D connection endpoints did not match canonical ports');
  // Physical-wire setup is optional metadata, NOT silently inferred from the 3D pixels.
  const wireSetup=viewer.wireSetup;
  assert(wireSetup?.toggle?.dataset.action==='wire-physics',
    '3D workspace lacks physical wire material setup');
  wireSetup.toggle.click();
  assert(wireSetup.panel.hidden===false,'Physical wire editing panel failed to open');
  assert(wireSetup.select.options.length===d.wires.length,'Physical wire choices are not canonical');
  wireSetup.apply.click();
  const savedWire=d.meta.physicalLayout?.wires?.[wireSetup.select.value];
  assert(savedWire?.material==='copper'&&savedWire.lengthMm===100,
    '3D wire setup did not persist explicit dimensions in original design');
  assert(wireSetup.result.textContent.includes('MODEL ONLY'),
    'Material calculator falsely asserted hardware-validated measurements');
  wireSetup.toggle.click();
  // Engineering CAD is a distinct, explicitly dimensioned physical envelope mode.
  const eng=viewer.engineering;
  assert(eng?.button?.dataset.action==='engineering-cad',
    'Dimensioned engineering workbench unavailable');
  eng.button.click();
  assert(eng.panel.hidden===false,'Engineering panel did not open');
  assert(eng.coupled?.dataset.action==='run-coupled-wire-dc',
    'Engineering mode lacks opt-in circuit/thermal solver');
  assert(eng.coupled.disabled===true,
    'Coupled DC solver must not activate for non-analog Logic Lab');
  assert(eng.selector.options.length===d.blocks.length,
    'CAD picker must use canonical design components');
  eng.save.click();
  assert(d.meta.dimensionedCAD?.parts?.[eng.selector.value]?.widthMm===20,
    'True-scale mm CAD dimensions not saved to canonical design JSON');
  eng.toggle.click();
  assert(eng.mode===true,'Dimensioned CAD view did not activate');
  viewer.render();
  assert(gl.getError()===gl.NO_ERROR,'Dimensioned CAD rendering failed');
  eng.toggle.click();
  assert(eng.mode===false,'Could not return to original 3D bench');
  eng.thermalButton.click();
  assert(eng.thermalResult.textContent.includes('MODEL ONLY'),
    'Thermal panel must label its calculated result as model-only');
  assert(d.meta.dimensionedCAD?.format==='invention-lab/dimensioned-cad-envelope/1',
    'CAD schema provenance missing');
  eng.button.click();
  // The physical-scale view now displays distinct hardware proxies and only
  // explicitly entered mm terminal-to-terminal conductor paths.
  eng.selector.value=b.id;
  eng.selector.dispatchEvent(new Event('change',{bubbles:true}));
  eng.fields[0].input.value='60';
  eng.save.click();
  assert(d.meta.dimensionedCAD?.parts?.[b.id]?.xMm===60,
    'Second real-scale component envelope not saved');
  const routingEditor=viewer.physicalRouting;
  assert(routingEditor?.toggle?.dataset.action==='physical-routes',
    'Physical terminal and conductor route editor missing');
  routingEditor.toggle.click();
  assert(!routingEditor.panel.hidden,'Physical harness panel failed to open');
  routingEditor.blocks.value=a.id;
  routingEditor.blocks.dispatchEvent(new Event('change',{bubbles:true}));
  routingEditor.ports.value='out';
  routingEditor.ports.dispatchEvent(new Event('change',{bubbles:true}));
  routingEditor.coordinates[0].input.value='10';
  routingEditor.coordinates[1].input.value='4';
  routingEditor.coordinates[2].input.value='0';
  routingEditor.saveTerminal.click();
  routingEditor.blocks.value=b.id;
  routingEditor.blocks.dispatchEvent(new Event('change',{bubbles:true}));
  routingEditor.ports.value='a';
  routingEditor.ports.dispatchEvent(new Event('change',{bubbles:true}));
  routingEditor.coordinates[0].input.value='-10';
  routingEditor.coordinates[1].input.value='4';
  routingEditor.coordinates[2].input.value='0';
  routingEditor.saveTerminal.click();
  assert(Object.keys(d.meta.physicalRouting?.terminals||{}).length===2,
    'Explicit canonical physical terminal coordinates not persisted');
  routingEditor.wires.value=d.wires.at(-1).id;
  routingEditor.wires.dispatchEvent(new Event('change',{bubbles:true}));
  routingEditor.waypoints.value='[]';
  routingEditor.saveHarness.click();
  assert(d.meta.physicalRouting?.routes?.[d.wires.at(-1).id],
    'Physical route cannot be saved using canonical wire endpoints');
  assert(routingEditor.routeMessage.textContent.includes('Route 40'),
    'Correct 40 mm physical conductor route not calculated');
  routingEditor.toggle.click();
  eng.toggle.click();
  assert(eng.mode===true,'True-scale 3D view did not reactivate');
  viewer.render();
  assert(gl.getError()===gl.NO_ERROR,'Real-size physical proxy and conductor draw failed');
  assert(viewer.notice.textContent.includes('1 explicit harnesses'),
    '3D scene did not render the true-scale explicit conductor route');
  eng.toggle.click();


  // Phase29: the SAME editable 3D component exposes only bounded, truthful
  // model provenance. Historical references NEVER validate this diagram.
  app.editor.selection={kind:'block',id:a.id};
  app._refreshInspector();
  app.switchOutputTab('atlas');
  const passport=app.currentEvidencePassport();
  assert(passport.viewMode==='3d','3D view provenance was not reflected in evidence passport');
  assert(passport.currentComponent?.id===a.id,'3D selected block did not bind to original diagram');
  assert(passport.currentDesign.blockCount===d.blocks.length,'passport lost current live netlist');
  assert(passport.currentDesign.wireCount===d.wires.length,'passport lost 3D wire');
  assert(passport.referenceCasesLinkedToCurrentDesign===0,
    'historical formal proof was falsely linked to the active user design');
  assert(passport.physicalVerdict==='unknown' && passport.realWorldBuildSuccessPercent===null,
    '3D component editing invented real silicon validation');
  assert(app.$outputBody.textContent.includes('MODEL ONLY'),
    'atlas omitted explicit software-only current diagram label');
  assert(app.$outputBody.textContent.includes('Final ALU mapped-gate Boolean proof'),
    'lab-linked historical formal reference absent');
  assert(app.$outputBody.querySelector('[data-action="export-evidence-passport"]'),
    'there is no usable evidence passport export action');
  assert(app.$exportMenu.querySelector('option[value="passport"]'),
    'evidence passport export missing from main workspace menu');
  assert(app.$editorToolbar.querySelector('#btn-view-evidence-atlas'),
    '3D editor toolbar lacks evidence provenance shortcut');

  app.switchLab('chip');
  app.switchOutputTab('atlas');
  assert(app.$outputBody.textContent.includes('Experimental GDS DRC'),
    'chip-specific physical model reference missing');
  assert(!app.$outputBody.textContent.includes('Iris public dataset model holdout'),
    'AI training evidence leaked into unrelated chip validation');

  app.switchLab('crosslab');
  app.switchOutputTab('atlas');
  assert(app.currentEvidencePassport().currentDesign===null,
    'cross-lab adapters incorrectly invented one canonical design');
  assert(app.$outputBody.textContent.includes('no single canonical design'),
    'cross-lab scope limitation missing');

  app.switchLab('logic');
  app.switchOutputTab('atlas');
  assert(app.currentEvidencePassport().realWorldBuildSuccessPercent===null,
    'switching domains invented manufacturing success');
  app.set3D(false);
  assert(viewer.root.style.display==='none','3D overlay not hidden in 2D mode');
  assert(app.editor.canvas.style.display!=='none','2D editor was not restored');
  app.switchLab('chip');
  assert(app.set3D(true),'Chip Lab could not use shared 3D view');
  app.switchLab('quantum');
  assert(app.set3D(true),'Quantum Lab could not use shared 3D view');
  app.switchLab('crosslab');
  assert(viewer.root.style.display==='none','3D overlay not hidden in Cross-Lab');
  app.switchLab('logic');
  app.switchOutputTab('evidence');
  assert(app.$outputBody.textContent.includes('Not estimated'),'build probability must be explicitly unavailable');

  // Phase 5: real browser interactions with the reusable assembly shelf,
  // canonical netlist instantiation, 3D drill-in and undo/redo.
  const grouped = app.createAssembly({name:'Reusable inverter group',blockIds:[a.id,b.id]});
  assert(grouped.template.blocks.length===2,'module capture did not retain two real components');
  assert(app.moduleLibrary.some(t=>t.id===grouped.template.id),'captured module not saved in library');
  const beforePlace=app.diagrams.logic.blocks.length;
  const instance=app.placeModule(grouped.template.id);
  assert(app.diagrams.logic.blocks.length===beforePlace+2,'placing module did not create real blocks');
  assert(instance.createdWireIds.length===1,'module did not preserve original internal connection');
  const afterPlace=app.diagrams.logic.blocks.length;
  app.undo();
  assert(app.diagrams.logic.blocks.length===afterPlace-2,'undo did not remove placed module');
  app.redo();
  assert(app.diagrams.logic.blocks.length===afterPlace,'redo did not restore placed module');

  app.focusAssembly(grouped.assembly.id);
  assert(app.scene3d.focusIds?.size===2,'3D assembly focus did not select group members');
  assert(app.scene3d.scene().blocks.length===2,'assembly drill-in failed to hide external components');
  app.scene3d.render();
  assert(app.scene3d.gl.getError()===app.scene3d.gl.NO_ERROR,'3D assembly rendering produced an error');
  app.focusAssembly(null);
  assert(app.scene3d.scene().blocks.length===afterPlace,'exit assembly did not restore full design');
  app.$assembliesButton.click();
  assert(app.assemblyShelf.open,'assemblies button did not open the editor panel');
  assert(app.assemblyShelf.root.textContent.includes('Reusable inverter group'),'assembly is missing in the panel');
  app.$assembliesButton.click();
  assert(!app.assemblyShelf.open,'assemblies panel could not be closed');
  app.ungroup(grouped.assembly.id);
  assert(app.diagrams.logic.blocks.length===afterPlace,'ungroup removed simulated components');

  // Phase 6: compose two real groups into a nested parametric module, then
  // place it with an explicit numeric override and explore its children.
  const originalGroup=app.createAssembly({name:'First leaf for nesting',blockIds:[a.id,b.id]});
  const secondGroup=instance.assembly.id;
  const composite=app.composeAssemblies({
    name:'Nested computing pair',groupIds:[originalGroup.assembly.id,secondGroup],
  });
  assert(composite.children.length===2,'nested module lost child references');
  assert(composite.parameters.length>0,'nested parameters not exposed');
  const control=composite.parameters.find(p=>p.target.paramKey==='value');
  assert(control,'numeric gate input control was not exposed');
  const previousCount=app.diagrams.logic.blocks.length;
  const nested=app.placeModule(composite.id,{[control.name]:1});
  assert(app.diagrams.logic.blocks.length===previousCount+4,
    'nested parameterized module did not expand into four real blocks');
  assert(nested.createdWireIds.length===2,'nested module lost leaf connection topology');
  assert(Object.keys(nested.assembly.childGroups).length>=2,'nested child provenance map absent');
  app.focusAssembly(nested.assembly.id,'child1');
  assert(app.scene3d.focusIds?.size===2,'nested child drill-in did not select its real blocks');
  assert(app.scene3d.scene().blocks.length===2,'nested scene showed unrelated components');
  app.scene3d.render();
  assert(app.scene3d.gl.getError()===app.scene3d.gl.NO_ERROR,'nested 3D group caused WebGL errors');
  app.focusAssembly(null);
  assert(app.scene3d.scene().blocks.length===previousCount+4,'leaving nested focus lost components');
  const encoded=app.moduleLibrary;
  assert(encoded.some(t=>t.id===composite.id),'composite not present in module library');
  app.$assembliesButton.click();
  assert(app.assemblyShelf.root.textContent.includes('Nested computing pair'),
    'nested module not visible in assembly shelf');
  app.$assembliesButton.click();

  app.switchOutputTab('evidence');
  assert(app.$outputBody.textContent.includes('Not estimated'),'assembly editing fabricated a build-success percentage');

  // Phase 7: the dedicated RISC-V architectural lab runs real encoded words
  // and reports a breakpoint, not an invented hardware timing or yield claim.
  app.switchLab('rv32i');
  assert(app.$centerPanel.textContent.includes('RISC-V RV32I'), 'RV32I architecture lab panel not registered');
  assert(app.$centerPanel.querySelector('[aria-label="RV32I machine-code editor"]'), 'RV32I machine-code editor missing');
  await app.run();
  assert(app.lastResult?.cpu?.regs?.[3]===12, 'RV32I browser execution did not produce x3 = 12');
  assert(app.lastResult.cpu.stopReason==='ebreak', 'RV32I browser execution did not reach the architectural breakpoint');
  app.switchOutputTab('evidence');
  assert(app.$outputBody.textContent.includes('Not estimated'), 'RV32I UI fabricated a physical success percentage');

  // Phase 8: only explicitly selected RV32IM may execute M operations.
  const isaSelector=app.$centerPanel.querySelector('[aria-label="RISC-V ISA profile"]');
  assert(isaSelector?.value==='rv32i','new RISC-V profile must default to RV32I');
  const sourceEditor=app.$centerPanel.querySelector('[aria-label="RV32I machine-code editor"]');
  sourceEditor.value='00600093\\n00700113\\n022081b3\\n00100073'.replaceAll('\\n','\n');
  sourceEditor.dispatchEvent(new Event('change',{bubbles:true}));
  await app.run();
  assert(app.lastResult?.cpu?.stopReason==='illegal-instruction','RV32I must reject MUL by default');
  isaSelector.value='rv32im';
  isaSelector.dispatchEvent(new Event('change',{bubbles:true}));
  const expected=app.$centerPanel.querySelectorAll('input[type="number"]');
  assert(expected.length>=2,'Expected register controls missing');
  expected[1].value='42';
  expected[1].dispatchEvent(new Event('change',{bubbles:true}));
  await app.run();
  assert(app.lastResult?.cpu?.regs?.[3]===42,'RV32IM browser MUL instruction did not compute 6*7');
  assert(app.lastResult.cpu.isa==='rv32im','RV32M opt-in ISA provenance missing');
  assert(app.diagrams.rv32i.meta.isa==='rv32im','RV32M ISA profile not saved into project');
  assert(app.diagrams.rv32i.meta.expectedValue===42,'RV32M expected register value not saved');
  app.switchOutputTab('evidence');
  assert(app.$outputBody.textContent.includes('Not estimated'),'RV32IM UI fabricated physical hardware confidence');
  app.switchLab('logic');

  // Phase 9 — real in-browser execution of the bounded float32 ONNX graph IR.
  // The external Python/ONNX Runtime reference is a separate CI job.
  app.switchLab('ai');
  const onnxSelector=app.$centerPanel.querySelector('[aria-label="ONNX operator graph example"]');
  const onnxButton=app.$centerPanel.querySelector('[data-action="run-onnx-subset"]');
  assert(onnxSelector&&onnxSelector.options.length===5,'five ONNX graph options missing from accelerator lab');
  assert(onnxButton,'ONNX graph execution button missing');
  const inference=await app.runOnnxExample('matmul-relu');
  assert(inference.kind==='onnx-subset'&&inference.executedNodes===2,'ONNX CPU graph did not execute');
  assert(JSON.stringify(inference.outputs.Y.values)===JSON.stringify([13,0,0,18]),
    'MatMul+Relu browser output differs from hand-verified tensor reference');
  assert(app.$outputBody.textContent.includes('MODEL-ONLY'),
    'ONNX app misleadingly implied that real ONNX Runtime executes in-browser');
  assert(app.$outputBody.textContent.includes('Not estimated'),
    'ONNX graph produced a fabricated physical success probability');
  assert(inference.physicalValidation==='none','ONNX browser inference cannot claim physical validation');

  // Phase 10: genuine in-browser JS 8-bit ONNX arithmetic, with external
  // ONNX Runtime available ONLY in the separate Phase 10 CI.
  const quantSelector=app.$centerPanel.querySelector('[aria-label="Quantized ONNX reference example"]');
  const quantButton=app.$centerPanel.querySelector('[data-action="run-quantized-onnx"]');
  assert(quantSelector?.options.length===6,'Phase 10 quantization examples absent');
  assert(quantButton,'Quantized ONNX run button absent');
  const signed=await app.runOnnxQuantizedExample('qlinear-int8-symmetric');
  assert(signed.output.dtype==='int8','Signed QLinearMatMul output dtype corrupted');
  assert(JSON.stringify(signed.output.values)===JSON.stringify([-6,4,10,-17]),
    'Signed 8-bit matrix multiply failed browser execution');
  const unsigned=await app.runOnnxQuantizedExample('qdq-uint8-offset-saturation');
  assert(unsigned.quantized?.dtype==='uint8','Unsigned Q/DQ quantization absent');
  assert(unsigned.output.values[0]===-32 && unsigned.output.values[5]===31.75,
    'Saturation and asymmetric zero points diverged from frozen example');
  assert(app.$outputBody.textContent.includes('MODEL-ONLY') &&
         app.$outputBody.textContent.includes('Not estimated'),
    'Quantized ONNX UI fabricated independent or physical validation');
  assert(unsigned.realWorldBuildSuccessPercent===null,'Quantized ONNX produced false build yield');

  // Phase 11: real browser JS numerical execution of 4D QLinearConv and
  // per-axis quantization. The independent ORT CPU runs only in GitHub CI.
  const convSelector=app.$centerPanel.querySelector('[aria-label="Phase 11 ONNX convolution and per-axis example"]');
  const convButton=app.$centerPanel.querySelector('[data-action="run-phase11-onnx"]');
  assert(convSelector?.options.length===6,'Phase 11 NCHW/per-axis examples absent');
  assert(convButton,'Phase 11 convolution run button absent');
  const conv=await app.runPhase11Example('qconv-mixed-per-channel');
  assert(conv.output.dtype==='uint8'&&
    JSON.stringify(conv.output.shape)===JSON.stringify([1,2,2,2]),
    'Quantized convolution output rank/shape invalid in browser');
  assert(JSON.stringify(conv.output.values)===JSON.stringify([192,129,178,152,255,204,34,144]),
    'Browser QLinearConv with per-channel scales and int32 bias diverged');
  const axisQ=await app.runPhase11Example('per-axis-uint8-negative-axis');
  assert(axisQ.normalizedAxis===0,'Per-axis negative axis normalization incorrect');
  assert(JSON.stringify(axisQ.quantized.values)===JSON.stringify([0,129,255,3,19,0]),
    'Browser per-axis uint8 Q intermediate diverged');
  assert(app.$outputBody.textContent.includes('MODEL-ONLY') &&
         app.$outputBody.textContent.includes('Not estimated'),
    'Phase 11 browser wrongly reported external or physical validation');
  assert(axisQ.realWorldBuildSuccessPercent===null,
    'Per-axis QDQ browser calculated an unjustified hardware manufacturing probability');

  // Phase 12: 30 genuine licensed UCI Iris labels held out of training.
  // Browser runs ONLY JS model; independently executed sklearn/ORT live in CI.
  const modelButton=app.$centerPanel.querySelector('[data-action="run-iris-holdout"]');
  assert(modelButton,'Real Iris model-level holdout button missing from the accelerator UI');
  const iris=await app.runIrisHoldoutBenchmark();
  assert(iris.kind==='iris-model-benchmark'&&iris.samples===30&&iris.trainSamples===120,
    'Real Iris model did not evaluate the bounded 120/30 test split');
  assert(iris.correct===29&&Math.abs(iris.accuracy-29/30)<1e-12,
    'Iris 30-row holdout model-level accuracy diverged from fixed real labels');
  assert(JSON.stringify(iris.confusion)===JSON.stringify([[10,0,0],[0,10,0],[0,1,9]]),
    'Iris per-class confusion matrix diverged from frozen holdout');
  assert(app.$outputBody.textContent.includes('CC BY 4.0') &&
         app.$outputBody.textContent.includes('MODEL-ONLY') &&
         app.$outputBody.textContent.includes('Not estimated'),
    'Real dataset UI lost license, model-only or physical-evidence warning');
  assert(iris.physicalValidation==='none'&&iris.realWorldBuildSuccessPercent===null,
    'Classification accuracy was misrepresented as physically validated chip yield');
  app.switchLab('logic');

  // Phase 13: an independently verified example ALU is never claimed as
  // physical evidence for the user's unverified chip/circuit design.
  app.switchLab('chip');
  app.switchOutputTab('evidence');
  // Phase32: open source-locked JSON catalog in the real browser after
  // inspecting the existing 3D workspace. No supplier source is a pass for
  // the editable diagram or a manufactured fan without target evidence.
  assert(app._sourceResearchPromise,'source-research catalog was not requested');
  const realResearch=await app._sourceResearchPromise;
  assert(realResearch?.sourceReferenceCount===12,
    'source research failed to load and check twelve public references');
  assert(realResearch.totalExplicitEvidenceRequirements===23,
    'missing physical input and uncertainty breakdown not rendered');
  assert(realResearch.fullyPhysicallySatisfiedRequirements===0,
    'nonmatching reference motor measurements promoted into actual fan evidence');
  assert(realResearch.realWorldBuildSuccessPercent===null,
    'external research metadata invented a physical success rate');
  const sourceUi=app.$outputBody.querySelector('[data-source-coverage="phase32"]');
  assert(sourceUi && sourceUi.textContent.includes('23 requirements') &&
    sourceUi.textContent.includes('physical measurements: 0'),
    'transparent source data gap summary not shown in browser');
  assert(sourceUi.querySelectorAll('a[target="_blank"]').length===14,
    'not all verified public reference links are shown');
  assert(sourceUi.textContent.includes('263,305 original sensor rows') &&
    sourceUi.textContent.includes('515.37 RPM versus 500 RPM source setpoint'),
    'Verified healthy source pulse-based measured speed absent from evidence UI');
  assert(sourceUi.textContent.includes('PG tach stuck HIGH') &&
    sourceUi.textContent.includes('500 RPM is the controller setting'),
    'Original faulty tachometer was promoted to validated motor RPM');
  assert(sourceUi.textContent.includes('NOT a calibrated fan model error'),
    'other motor supplier data was incorrectly promoted to physical model accuracy');
  const chipEvidence=app.$outputBody.textContent;
  assert(app.$outputBody.querySelectorAll('.physical-readiness-ladder li').length===10,
    'Design-specific physical evidence ladder must enumerate every gate');
  assert(chipEvidence.includes('UNKNOWN') &&
         chipEvidence.includes('NOT ESTIMATED') &&
         chipEvidence.includes('DRC/LVS/PVT'),
    'Chip evidence panel falsely promoted simulation or example CI to silicon signoff');
  assert(chipEvidence.includes('NOT evidence that this diagram passes'),
    'Example ALU mapping was misattributed to the currently edited design');
  // Phase31: this is a genuinely calculated conditional model result, NOT
  // a statement that the current chip diagram physically passed.
  const fanPanel=app.$outputBody.querySelector('.phase31-fan-evidence');
  assert(fanPanel,'first-principles electrical and fan motor demonstration missing');
  assert(fanPanel.textContent.includes('NOT the current design'),
    'fan example incorrectly presented as the current user-created design');
  const calculate=fanPanel.querySelector('[data-action="phase31-fan-calculate"]');
  const fanResult=fanPanel.querySelector('[data-fan-result="phase31"]');
  assert(calculate&&fanResult,'fan conditional probability controls absent');
  calculate.click();
  assert(fanResult.textContent.includes('CONDITIONAL MODEL pass:') &&
    fanResult.textContent.includes('ACTUAL physical/build success: UNKNOWN'),
    'browser incorrectly equates modelled success percentage with physical yield');
  assert(!fanResult.textContent.includes('99% physically verified'),
    'fabricated independent hardware qualification shown');
  fanPanel.querySelector('[data-fan-field="rpmDiscrepancyAllowance"]').value='180';
  calculate.click();
  assert(fanResult.textContent.includes('If your ASSUMED RPM error bound holds'),
    'hypothetical discrepancy model error was hidden');
  fanPanel.querySelector('[data-fan-field="voltageV"]').value='-2';
  calculate.click();
  assert(fanResult.textContent.includes('Cannot calculate:'),
    'nonphysical battery voltage was silently accepted');
  app.switchLab('logic');

  output.dataset.smokeResult='pass';
  output.textContent='PASS — 3D hardware editor, RTL/ONNX models and chip-specific 10-stage UNKNOWN physical evidence ladder';
}catch(err){
  output.dataset.smokeResult='fail';
  output.textContent='FAIL — '+String(err.stack||err.message||err);
}
</script></body></html>
