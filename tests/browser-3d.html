<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Invention Lab WebGL browser smoke</title>
<link rel="stylesheet" href="../css/style.css"></head>
<body>
<div id="app"></div>
<pre id="smoke-result" data-smoke-result="pending">PENDING</pre>
<script type="module">
import '../js/main.js';
import { sceneFromDiagram, portPoint3D } from '../js/scene/layout.js';
const output=document.querySelector('#smoke-result');
const assert=(condition,message)=>{if(!condition)throw Error(message);};
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
try{
  await pause(180);
  const app=window.inventionLab?.app;
  assert(app,'application failed to boot');
  app.switchLab('logic');
  const d=app.diagrams.logic;
  const before=d.blocks.length;
  const a=app.editor.addBlock('logic.IN',0,0);
  const b=app.editor.addBlock('logic.NOT',240,0);
  assert(d.blocks.length===before+2,'adding canonical logic blocks failed');
  assert(app.set3D(true)===true,'WebGL view failed to activate');
  await pause(150);
  assert(app.scene3d.available,'WebGL unavailable');
  const gl=app.scene3d.gl;
  app.scene3d.render();
  assert(gl.getError()===gl.NO_ERROR,'WebGL draw produced a GL error');
  const scene=sceneFromDiagram(d);
  const out=portPoint3D(scene.blocks.find(x=>x.id===a.id),'out','out');
  const input=portPoint3D(scene.blocks.find(x=>x.id===b.id),'a','in');
  assert(out && input,'3D ports missing');
  const viewer=app.scene3d;
  const clickPort=point=>{
    const pos=viewer.project(point);
    assert(pos,'port projected behind camera');
    const rect=viewer.canvas.getBoundingClientRect();
    const event=new PointerEvent('pointerdown',{bubbles:true,cancelable:true,
      pointerId:1,clientX:rect.left+pos.x,clientY:rect.top+pos.y});
    viewer.canvas.dispatchEvent(event);
  };
  const count=d.wires.length;
  clickPort(out);
  assert(viewer.wireSource?.blockId===a.id,'3D output socket was not selected');
  clickPort(input);
  assert(d.wires.length===count+1,'3D click-to-wire did not update real Diagram');
  assert(d.wires.at(-1).from.block===a.id && d.wires.at(-1).to.block===b.id,
    '3D connection endpoints did not match canonical ports');
  app.set3D(false);
  assert(viewer.root.style.display==='none','3D overlay not hidden in 2D mode');
  assert(app.editor.canvas.style.display!=='none','2D editor was not restored');
  app.switchLab('chip');
  assert(app.set3D(true),'Chip Lab could not use shared 3D view');
  app.switchLab('quantum');
  assert(app.set3D(true),'Quantum Lab could not use shared 3D view');
  app.switchLab('crosslab');
  assert(viewer.root.style.display==='none','3D overlay not hidden in Cross-Lab');
  app.switchLab('logic');
  app.switchOutputTab('evidence');
  assert(app.$outputBody.textContent.includes('Not estimated'),'build probability must be explicitly unavailable');

  // Phase 5: real browser interactions with the reusable assembly shelf,
  // canonical netlist instantiation, 3D drill-in and undo/redo.
  const grouped = app.createAssembly({name:'Reusable inverter group',blockIds:[a.id,b.id]});
  assert(grouped.template.blocks.length===2,'module capture did not retain two real components');
  assert(app.moduleLibrary.some(t=>t.id===grouped.template.id),'captured module not saved in library');
  const beforePlace=app.diagrams.logic.blocks.length;
  const instance=app.placeModule(grouped.template.id);
  assert(app.diagrams.logic.blocks.length===beforePlace+2,'placing module did not create real blocks');
  assert(instance.createdWireIds.length===1,'module did not preserve original internal connection');
  const afterPlace=app.diagrams.logic.blocks.length;
  app.undo();
  assert(app.diagrams.logic.blocks.length===afterPlace-2,'undo did not remove placed module');
  app.redo();
  assert(app.diagrams.logic.blocks.length===afterPlace,'redo did not restore placed module');

  app.focusAssembly(grouped.assembly.id);
  assert(app.scene3d.focusIds?.size===2,'3D assembly focus did not select group members');
  assert(app.scene3d.scene().blocks.length===2,'assembly drill-in failed to hide external components');
  app.scene3d.render();
  assert(app.scene3d.gl.getError()===app.scene3d.gl.NO_ERROR,'3D assembly rendering produced an error');
  app.focusAssembly(null);
  assert(app.scene3d.scene().blocks.length===afterPlace,'exit assembly did not restore full design');
  app.$assembliesButton.click();
  assert(app.assemblyShelf.open,'assemblies button did not open the editor panel');
  assert(app.assemblyShelf.root.textContent.includes('Reusable inverter group'),'assembly is missing in the panel');
  app.$assembliesButton.click();
  assert(!app.assemblyShelf.open,'assemblies panel could not be closed');
  app.ungroup(grouped.assembly.id);
  assert(app.diagrams.logic.blocks.length===afterPlace,'ungroup removed simulated components');
  app.switchOutputTab('evidence');
  assert(app.$outputBody.textContent.includes('Not estimated'),'assembly editing fabricated a build-success percentage');
  output.dataset.smokeResult='pass';
  output.textContent='PASS — WebGL, typed 3D wiring, module capture/instantiation, assembly drill-in, undo/redo and evidence panel';
}catch(err){
  output.dataset.smokeResult='fail';
  output.textContent='FAIL — '+String(err.stack||err.message||err);
}
</script></body></html>
