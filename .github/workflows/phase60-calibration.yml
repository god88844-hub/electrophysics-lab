name: Phase 60 independent device holdout and hardware calibration intake
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  physically-unmeasured-accelerator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/phase60-calibration.test.mjs
      - run: |
          node scripts/phase60-run.mjs
          node scripts/phase60-strict.mjs
      - run: npm test
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase60-unmeasured-accelerator-hardware-intake
          path: |
            benchmarks/phase60/accelerator-calibration-policy.json
            benchmarks/evidence/phase60/phase60.json
          if-no-files-found: warn
