name: Stage M native SKY130A Magic Netgen ngspice acceptance attempt
on:
  pull_request:
  push:
    branches: [stage-m/phase73-77-foundry-guarded]
  workflow_dispatch:
# Push and PR events for one Stage M branch use the SAME concurrency group.
# Prevents more than one new native qualification workflow from running,
# but cannot retroactively attach older runs that lacked this group.
concurrency:
  group: stage-m-native-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cancel two explicitly superseded queued native EDA runs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for id in 44373173980 44375448415; do
            run_status="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.status')"
            if [ "$run_status" = "queued" ] || [ "$run_status" = "in_progress" ]; then
              gh api -X POST "repos/$GH_REPO/actions/runs/$id/cancel" --silent
              echo "Requested cancellation for superseded run $id"
            else
              echo "Superseded run $id already $run_status"
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject nonexistent PDK devices and verify candidate subcircuit boundaries
        run: node --test tests/stage-m-q4-sources.test.mjs tests/stage-m-native-monte-carlo.test.mjs
  native-q4-drc-lvs-pex:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: source-inventory
    env:
      EDA_PREFIX: /home/runner/.cache/stage-m-eda
      PDK_ROOT: /home/runner/.cache/stage-m-eda/share/pdk
      STAGE_M_ORIGINAL_SKY130_MODELS: /tmp/stage-m-skywater-pr
      LD_LIBRARY_PATH: /home/runner/.cache/stage-m-eda/lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ngspice git make gcc g++ autoconf automake libtool \
            m4 tcsh tcl-dev tk-dev libx11-dev libxpm-dev \
            libcairo2-dev libncurses-dev libreadline-dev zlib1g-dev
          ngspice --version
      - name: Restore compiled Magic Netgen and PDK build outputs
        id: native-eda-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/stage-m-eda
          key: ubuntu2404-stage-m-native-magic4205ad22-netgene2a49567-openpdks0c1f8232-prf62031a1-v1
      - name: Register cached/compiled native EDA binaries
        run: |
          mkdir -p "$EDA_PREFIX/bin"
          echo "$EDA_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Build source-commit-pinned native Magic
        if: steps.native-eda-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/RTimothyEdwards/magic.git /tmp/stage-m-magic
          git -C /tmp/stage-m-magic checkout --detach 4205ad22bf919cc183af997b60c21140fd6d6fa9
          test "$(git -C /tmp/stage-m-magic rev-parse HEAD)" = 4205ad22bf919cc183af997b60c21140fd6d6fa9
          cd /tmp/stage-m-magic
          ./configure --prefix="$EDA_PREFIX"
          make -j2
          make install
          "$EDA_PREFIX/bin/magic" --version
      - name: Build source-commit-pinned native Netgen
        if: steps.native-eda-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/RTimothyEdwards/netgen.git /tmp/stage-m-netgen
          git -C /tmp/stage-m-netgen checkout --detach e2a49567d5e3e451d51130de0227678be31f32e0
          test "$(git -C /tmp/stage-m-netgen rev-parse HEAD)" = e2a49567d5e3e451d51130de0227678be31f32e0
          cd /tmp/stage-m-netgen
          ./configure --prefix="$EDA_PREFIX"
          make -j2
          make install
          test -x "$EDA_PREFIX/bin/netgen"
      - name: Checkout exact original SKY130 device-model commit
        run: |
          git clone -q https://github.com/google/skywater-pdk-libs-sky130_fd_pr.git "$STAGE_M_ORIGINAL_SKY130_MODELS"
          git -C "$STAGE_M_ORIGINAL_SKY130_MODELS" checkout --detach f62031a1be9aefe902d6d54cddd6f59b57627436
          test "$(git -C "$STAGE_M_ORIGINAL_SKY130_MODELS" rev-parse HEAD)" = f62031a1be9aefe902d6d54cddd6f59b57627436
          node scripts/phase73-source-check.mjs
      - name: Build source-pinned open_pdks Magic technology and Netgen setup
        if: steps.native-eda-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/fossi-foundation/open-pdks.git /tmp/stage-m-open-pdks
          git -C /tmp/stage-m-open-pdks checkout --detach 0c1f82326278a0871f0a1fc4bdacf94c88e78e4d
          test "$(git -C /tmp/stage-m-open-pdks rev-parse HEAD)" = 0c1f82326278a0871f0a1fc4bdacf94c88e78e4d
          cd /tmp/stage-m-open-pdks
          ./configure --prefix="$EDA_PREFIX" --enable-sky130-pdk \
            --with-sky130-variants=A \
            --enable-primitive-sky130="$STAGE_M_ORIGINAL_SKY130_MODELS" \
            --disable-io-sky130 \
            --disable-sc-hs-sky130 --disable-sc-ms-sky130 \
            --disable-sc-ls-sky130 --disable-sc-lp-sky130 \
            --disable-sc-hd-sky130 --disable-sc-hdll-sky130 \
            --disable-sc-hvl-sky130 \
            --disable-alpha-sky130 --disable-xschem-sky130
          make -j2
          make install
          test -s "$PDK_ROOT/sky130A/libs.tech/magic/sky130A.magicrc"
          test -s "$PDK_ROOT/sky130A/libs.tech/netgen/sky130A_setup.tcl"
      - name: Verify restored or newly-built native EDA artifacts
        run: |
          test -x "$EDA_PREFIX/bin/magic"
          test -x "$EDA_PREFIX/bin/netgen"
          test -s "$PDK_ROOT/sky130A/libs.tech/magic/sky130A.magicrc"
          test -s "$PDK_ROOT/sky130A/libs.tech/netgen/sky130A_setup.tcl"
          "$EDA_PREFIX/bin/magic" --version
          "$EDA_PREFIX/bin/netgen" -batch -help > /tmp/stage-m-netgen-help.txt 2>&1 || true
          test -s /tmp/stage-m-netgen-help.txt
          sha256sum "$EDA_PREFIX/bin/magic" "$EDA_PREFIX/bin/netgen"
      - name: Save native EDA build cache even when physical qualification fails later
        if: steps.native-eda-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/stage-m-eda
          key: ubuntu2404-stage-m-native-magic4205ad22-netgene2a49567-openpdks0c1f8232-prf62031a1-v1
      - name: Record actual PDK/tool provenance and fail on missing mismatch corner
        run: |
          mkdir -p benchmarks/evidence/stage-m-native-eda
          {
            echo "magic_source_commit=4205ad22bf919cc183af997b60c21140fd6d6fa9"
            echo "netgen_source_commit=e2a49567d5e3e451d51130de0227678be31f32e0"
            echo "open_pdks_source_commit=0c1f82326278a0871f0a1fc4bdacf94c88e78e4d"
            sha256sum "$EDA_PREFIX/bin/magic" "$EDA_PREFIX/bin/netgen"
            echo "sky130_original=$(git -C "$STAGE_M_ORIGINAL_SKY130_MODELS" rev-parse HEAD)"
            echo "ngspice=$(command -v ngspice)"
          } > benchmarks/evidence/stage-m-native-eda/TOOLCHAIN.txt
          lib="$PDK_ROOT/sky130A/libs.tech/ngspice/sky130.lib.spice"
          test -s "$lib"
          export STAGE_M_PROCESSED_SKY130_LIB="$lib"
          # Audit the exact generator source at the pinned revision EVEN ON A CACHE HIT.
          git clone -q https://github.com/fossi-foundation/open-pdks.git /tmp/stage-m-open-pdks-audit
          git -C /tmp/stage-m-open-pdks-audit checkout --detach 0c1f82326278a0871f0a1fc4bdacf94c88e78e4d
          export STAGE_M_OPEN_PDKS_SOURCE=/tmp/stage-m-open-pdks-audit
          export STAGE_M_MISMATCH_AUDIT_REPORT="$PWD/benchmarks/evidence/stage-m-native-eda/mm-declaration-audit.json"
          node scripts/stage-m-mm-corner-audit.mjs
          sha256sum "$lib" >> benchmarks/evidence/stage-m-native-eda/TOOLCHAIN.txt
          echo 'tt_mm section inspected; explicit deck mc_mm_switch=1 still required; calibration UNKNOWN' >> benchmarks/evidence/stage-m-native-eda/TOOLCHAIN.txt
      - name: Export exact 4000 primitive and 2400 ALU trial plan (not executed)
        run: node scripts/stage-m-native-campaign-plan.mjs
      - name: Run native layout DRC and LVS with separately extracted full PEX
        run: bash scripts/stage-m-native-eda.sh
      - name: Mandatory physical, statistical and ALU acceptance must stay fail-closed
        run: |
          echo "No approved source-bound 1000-trial postlayout MC or 100-trial ALU comparison is available." >&2
          echo "Stage M Level-1 = INSUFFICIENT_MODEL_DATA; Level-2 = UNQUALIFIED_NO_GO" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-m-real-native-eda-unqualified-evidence
          path: benchmarks/evidence/stage-m-native-eda/
          if-no-files-found: warn
