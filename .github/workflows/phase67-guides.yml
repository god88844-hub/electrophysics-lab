name: Phase 67 guided accessible engineering workspaces
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guided-workflow-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/phase67-guided-workflow.test.mjs
      - run: |
          node scripts/phase67-run.mjs
          node scripts/phase67-strict.mjs
      - run: npm test
      - run: node scripts/browser-smoke.mjs
