name: Segmented thermal blind holdout candidate fit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  holdout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/wire-thermal-holdout.test.mjs tests/segmented-wire-thermal.test.mjs
      - run: node --check js/scene/wire-thermal-holdout.js
