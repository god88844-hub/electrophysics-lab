# Dedicated real-browser validation of source-scoped multi-lab reference atlas.
name: Phase 29 real browser multi lab 3D evidence atlas integration
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  evidence-atlas-ui-and-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject historical proof leakage and model provenance spoofing
        run: node --test tests/phase29-evidence-atlas.test.mjs
      - name: Verify archived Git source and all lab contexts
        run: node scripts/phase29-capture.mjs
      - name: Independently replay source objects, hashes, all zero hardware claims
        run: node scripts/phase29-strict.mjs
      - name: Real Chromium/WebGL 3D and crosslab atlas interaction
        run: node scripts/browser-smoke.mjs
      - name: Report strict source-only limitations
        if: always()
        run: |
          if test -s benchmarks/evidence/phase29/phase29-summary.json; then
            cat benchmarks/evidence/phase29/phase29-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Phase29 UI integration is not source-verified; physical status UNKNOWN" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase29-source-anchored-webgl-evidence-atlas-replay
          path: |
            benchmarks/evidence/phase29/phase29.json
            benchmarks/evidence/phase29/phase29-summary.json
          if-no-files-found: warn
