name: Phase 32 researched physical data and source applicability checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-source-transfer-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject physical evidence from wrong motors and self-declared fake raw CSV
        run: node --test tests/phase32-source-evidence.test.mjs
      - name: All original scientific tests and adversarial simulations
        run: npm test
      - name: Recompute published supplier spec units and all required missing sources
        run: node scripts/phase32-run.mjs
      - name: Independently strict-replay all source URLs, input hashes and physical blockers
        run: node scripts/phase32-strict.mjs
      - name: Reproduce original modeled fan conditional percentage and strict replay
        run: |
          node scripts/phase31-run.mjs
          node scripts/phase31-strict.mjs
      - name: Real headless Chromium/WebGL research links and missing target data status
        run: node scripts/browser-smoke.mjs
      - name: Publish accurate evidence status
        if: always()
        run: |
          if test -s benchmarks/evidence/phase32/phase32-summary.json; then
            cat benchmarks/evidence/phase32/phase32-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Public raw data original acquisition unverified; real fan success UNKNOWN" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase32-source-researched-data-and-gaps-not-physical-silicon
          path: |
            docs/PHASE32-RESEARCH-PHYSICAL-DATA.md
            benchmarks/phase32/public-source-catalog.json
            benchmarks/evidence/phase32/*.json
          if-no-files-found: warn
