name: Phase 72 final research-source candidate and separate physical qualification
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  draft-research-release-no-physical-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/phase72-final-audit.test.mjs
      - run: |
          node scripts/phase72-run.mjs
          node scripts/phase72-strict.mjs
      - run: npm test
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase72-draft-research-candidate-not-approved-product
          path: |
            benchmarks/phase72/final-policy.json
            benchmarks/evidence/phase72/phase72.json
            benchmarks/evidence/phase72/package/invention-lab-web.tar
            benchmarks/evidence/phase72/package/phase69.json
          if-no-files-found: warn
