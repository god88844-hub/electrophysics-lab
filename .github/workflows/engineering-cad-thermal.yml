name: Dimensioned engineering CAD and electrothermal model
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  engineering-cad-thermal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/engineering-cad-thermal.test.mjs tests/physical-wire.test.mjs
      - run: node --check js/scene/dimensioned-cad.js
      - run: node --check js/scene/wire-electrothermal.js
      - run: node --check js/scene/wire-measurement-check.js
      - run: node --check js/scene/engineering-ui.js
