name: Local mm OBJ mesh 3D import
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  obj:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/imported-obj-geometry.test.mjs tests/physical-routing-3d.test.mjs
      - run: node --check js/scene/imported-obj-geometry.js
      - run: node --check js/scene/engineering-ui.js
      - run: node --check js/scene/detailed-cad-mesh.js
      - run: node --check js/scene/viewer.js
