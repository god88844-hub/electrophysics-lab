name: Phase 55 original ALU fabrication/metrology provenance boundary
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quarantine-external-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/phase55-provenance.test.mjs
      - run: |
          node scripts/phase55-run.mjs
          node scripts/phase55-strict.mjs
      - run: npm test
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase55-unqualified-alu-origin-screen
          path: |
            benchmarks/phase55/provenance-policy.json
            benchmarks/evidence/phase55/phase55.json
          if-no-files-found: warn
