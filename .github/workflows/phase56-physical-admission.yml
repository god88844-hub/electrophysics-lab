name: Phase 56 physical data admission and independent review gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fail-closed-alu-physical-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/phase56-admission.test.mjs
      - run: |
          node scripts/phase56-run.mjs
          node scripts/phase56-strict.mjs
      - run: npm test
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase56-unqualified-measurement-quarantine
          path: |
            benchmarks/phase56/admission-policy.json
            benchmarks/evidence/phase56/phase56.json
          if-no-files-found: warn
