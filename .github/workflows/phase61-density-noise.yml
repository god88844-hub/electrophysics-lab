name: Phase 61 bounded density matrix Kraus noise channels
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quantum-density-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/phase61-density-noise.test.mjs
      - run: |
          node scripts/phase61-run.mjs
          node scripts/phase61-strict.mjs
      - run: npm test
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase61-density-matrix-conditional-not-hardware
          path: |
            benchmarks/phase61/noise-scope.json
            benchmarks/evidence/phase61/phase61.json
          if-no-files-found: warn
