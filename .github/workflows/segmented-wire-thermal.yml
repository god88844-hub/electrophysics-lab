name: Segmented 1D wire thermal regression
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  segmented-wire:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/segmented-wire-thermal.test.mjs tests/engineering-cad-thermal.test.mjs tests/coupled-wire-dc.test.mjs
      - run: node --check js/scene/wire-electrothermal.js
      - run: node --check js/scene/engineering-ui.js
