name: Independent Ngspice coupled DC wire reference
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  coupled-wire-ngspice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install independent electrical oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          ngspice --version
      - name: Compare original augmented JS MNA with real Ngspice DC
        run: node scripts/coupled-wire-ngspice.mjs
