name: Phase 46 fan affinity ratio source and physical qualification gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ratio-only-fan-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source scope and fan-law adversarial tests
        run: node --test tests/phase46-fan-affinity.test.mjs
      - name: Independently replay dimensionless fan-law research model
        run: |
          node scripts/phase46-run.mjs
          node scripts/phase46-strict.mjs
      - name: Complete scientific software regressions
        run: npm test
      - name: Browser evidence smoke
        run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase46-fan-law-ratio-only-not-a-qualified-impeller
          path: |
            benchmarks/phase46/fan-affinity-assumptions.json
            benchmarks/evidence/phase46/phase46.json
          if-no-files-found: warn
