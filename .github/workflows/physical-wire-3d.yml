name: Physical wire material model and native unit tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  physical-wire-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/physical-wire.test.mjs
