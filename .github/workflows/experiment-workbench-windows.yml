name: Windows local quick start and 3D workbench regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-native-node-tests:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Complete native Windows npm test
        run: npm test
  ubuntu-chromium-3d-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/experiment-bench.test.mjs
      - run: node scripts/browser-smoke.mjs
