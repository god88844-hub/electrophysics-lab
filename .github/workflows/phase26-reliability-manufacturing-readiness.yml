name: Phase 26 real device variation and unverified ALU failure mode audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-replayed-physical-reliability-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject fake FIT, wafer sigma, yield, aging and reliability
        run: node --test tests/phase26-reliability.test.mjs
      - name: Actual independently sourced resistor measurements
        run: bash scripts/phase26-run.sh
      - name: Independently reopen original data without estimating missing failure rates
        run: node scripts/phase26-strict.mjs
      - name: Publish scientific limits and missing silicon reliability
        if: always()
        run: |
          if test -s benchmarks/evidence/phase26/phase26-summary.json; then
            cat benchmarks/evidence/phase26/phase26-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No verified physical reliability data; original ALU status UNKNOWN" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase26-measured-resistor-variation-and-unverified-alu-failure-audit
          path: |
            benchmarks/phase26/acceptance.json
            benchmarks/evidence/phase26/phase26.json
            benchmarks/evidence/phase26/phase26-summary.json
            benchmarks/evidence/phase26/tool-logs/*.log
            benchmarks/evidence/phase23/raw/*.mdm
            benchmarks/evidence/phase23/raw/README.rst
            benchmarks/evidence/phase25/phase25.json
            benchmarks/evidence/phase25/phase25-summary.json
            benchmarks/evidence/phase24/phase24-summary.json
          if-no-files-found: warn
