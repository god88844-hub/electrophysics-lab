[workspace]
resolver = "2"
# Dual-target kernel workspace (WP-1.2):
#   - crates/ep-kernel             native kernel entry (Tauri IPC / typed-array buffers)
#   - crates/ep-kernel/ep-core     units, SHA-256-verified reference data, schema mirrors, admission
#   - crates/ep-kernel/ep-circuit  MNA DC solver (WP-2.1)
#   - crates/ep-kernel/ep-thermal  implicit (BE/CN) Fourier heat PDE + forensics (WP-2.3)
#   - crates/ep-kernel/ep-chip     cycle-accurate RV32IM/Custom-ISA CPU + TPU (WP-4.1/4.3)
#   - crates/ep-kernel/ep-quantum  Lindblad/Kraus + Pauli-frame QEC (WP-5.1/5.2)
#   - crates/ep-kernel/ep-logic    event-driven multi-radix logic simulator (WP-3.1)
#   - crates/ep-kernel-wasm        wasm-bindgen exports for browser dev preview + CI
members = [
    "crates/ep-kernel",
    "crates/ep-kernel/ep-core",
    "crates/ep-kernel/ep-circuit",
    "crates/ep-kernel/ep-chip",
    "crates/ep-kernel/ep-quantum",
    "crates/ep-kernel/ep-logic",
    "crates/ep-kernel/ep-thermal",
    "crates/ep-kernel-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
